<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 98 ISO 测试</title>
    <style>
        body {
            background-color: #008080;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #screen-container {
            border: 3px solid #fff;
            background: #000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #screen {
            white-space: pre;
            font-family: monospace;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 4px;
        }
    </style>
    <script src="https://copy.sh/v86/build/libv86.js"></script>
</head>
<body>

    <h2>Win98 ISO 网页运行测试</h2>

    <div id="screen-container">
        <div id="screen"></div>
    </div>

    <div class="status" id="status">正在准备从 Release 加载 164MB ISO...</div>

    <script>
        window.onload = function() {
            var statusText = document.getElementById("status");

            var emulator = new V86Starter({
                wasm_path: "https://copy.sh/v86/build/v86.wasm",
                screen_container: document.getElementById("screen"),
                memory_size: 128 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,

                bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
                vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },

                // 填入你发布的 ISO 链接 (推荐优先使用 jsDelivr CDN 加速/跨域解封)
                cdrom: {
                    url: "https://cdn.jsdelivr.net/gh/wong93532-source/kolibrios-web@v1.0/win98.iso"
                    // 备用：直连 GitHub Release (如果 CDN 没生效可以换回下面这行)
                    // url: "https://github.com/wong93532-source/kolibrios-web/releases/download/v1.0/win98.iso"
                },

                // 强制优先光盘启动
                boot_order: 0x312,

                autostart: true
            });

            emulator.add_listener("emulator-ready", function() {
                statusText.innerText = "虚拟机就绪！镜像下载中（164MB 需要点时间），请稍候...";
            });
        };
    </script>
</body>
</html>
