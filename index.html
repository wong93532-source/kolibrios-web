<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KolibriOS Web Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin: 5px 0; font-size: 1.4rem; color: #4da6ff; }
    #screen_container {
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 2px solid #333;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      line-height: 0;
      margin-bottom: 15px;
    }
    canvas { display: block; }
    
    #log_container {
      width: 100%;
      max-width: 640px;
      background: #090909;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px;
    }
    #log_title {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #log_output {
      height: 120px;
      overflow-y: auto;
      font-size: 0.75rem;
      color: #00ff66;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-err { color: #ff5555; }
    .log-info { color: #00aaff; }
  </style>

  <!-- 改用 CDNJS / jsDelivr 的稳定公网 CDN，解决网络拦截与跨域问题 -->
  <script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js"></script>
</head>
<body>

  <h1>KolibriOS 网页运行版</h1>

  <div id="screen_container">
    <canvas id="screen"></canvas>
  </div>

  <div id="log_container">
    <div id="log_title">系统运行日志 (Runtime Log)</div>
    <div id="log_output"></div>
  </div>

  <script>
    const logOutput = document.getElementById("log_output");

    function log(msg, type = "normal") {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      if (type === "error") div.className = "log-err";
      if (type === "info") div.className = "log-info";
      div.textContent = `[${time}] ${msg}`;
      logOutput.appendChild(div);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    function initV86() {
      if (typeof V86Starter === "undefined") {
        log("CDN 核心库 (libv86.js) 被浏览器拦截或加载超时！", "error");
        log("请尝试关闭广告拦截插件 (AdBlock/uBlock) 或更换网络尝试。", "error");
        return;
      }

      log("核心库就绪，开始向 v86 载入 BIOS 及镜像...", "info");

      try {
        var emulator = new V86Starter({
          // 全部使用 jsDelivr 全球加速 CDN 的依赖项
          wasm_path: "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm",
          bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin" },
          vga_bios: { url: "https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin" },
          
          memory_size: 64 * 1024 * 1024,
          vga_memory_size: 8 * 1024 * 1024,
          screen_container: document.getElementById("screen_container"),
          fda: { url: "./kolibri.img" }, // 挂载你的软盘镜像
          autostart: true,
        });

        log("KolibriOS 启动指令已发送！", "info");
      } catch (e) {
        log("初始化崩溃: " + e.message, "error");
      }
    }

    window.onload = function() {
      log("检测本地 kolibri.img 镜像...", "info");
      fetch("./kolibri.img", { method: "HEAD" })
        .then(res => {
          if (!res.ok) {
            log(`镜像文件读取失败 (HTTP ${res.status})，请确认 kolibri.img 已提交到 GitHub。`, "error");
          } else {
            log("kolibri.img 检测通过！", "info");
            initV86();
          }
        })
        .catch(err => log("网络检测异常: " + err.message, "error"));
    };
  </script>

</body>
</html>
