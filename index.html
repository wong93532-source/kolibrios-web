<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KolibriOS Web Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin: 5px 0 10px 0; font-size: 1.3rem; color: #4da6ff; text-align: center; }
    
    #screen_container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 2px solid #333;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      margin-bottom: 12px;
      position: relative;
    }
    #screen_container canvas, #screen_container div {
      width: 100% !important;
      height: 100% !important;
    }
    
    #log_container {
      width: 100%;
      max-width: 800px;
      background: #090909;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px;
    }
    #log_title { font-size: 0.75rem; color: #666; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    #log_output { height: 120px; overflow-y: auto; font-size: 0.75rem; color: #00ff66; white-space: pre-wrap; word-break: break-all; }
    .log-err { color: #ff5555; }
    .log-info { color: #00aaff; }
    .log-ok { color: #00ff66; }
  </style>
</head>
<body>

  <h1>KolibriOS 网页运行版</h1>

  <div id="screen_container">
    <div style="white-space: pre; font-family: monospace; line-height: 14px; font-size: 13px; color: #aaa;"></div>
    <canvas></canvas>
  </div>

  <div id="log_container">
    <div id="log_title">系统运行日志 (Runtime Log)</div>
    <div id="log_output"></div>
  </div>

  <script type="module">
    const logOutput = document.getElementById("log_output");

    function log(msg, type = "normal") {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      if (type === "error") div.className = "log-err";
      if (type === "info") div.className = "log-info";
      if (type === "ok") div.className = "log-ok";
      div.textContent = `[${time}] ${msg}`;
      logOutput.appendChild(div);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    async function checkFiles() {
      const files = ["./seabios.bin", "./vgabios.bin", "./kolibri.img"];
      log("开始校验本地 OS 镜像文件...", "info");

      for (const file of files) {
        try {
          const res = await fetch(file, { method: "HEAD" });
          if (!res.ok) {
            log(`缺失文件: ${file} (HTTP ${res.status})`, "error");
            return false;
          }
        } catch (e) {
          log(`无法读取文件: ${file}`, "error");
          return false;
        }
      }
      log("镜像文件校验成功！", "ok");
      return true;
    }

    async function init() {
      const ready = await checkFiles();
      if (!ready) return;

      log("正在载入 v86 WebAssembly 引擎...", "info");

      let V86Starter;
      try {
        const mod = await import("https://cdn.jsdelivr.net/npm/v86@0.4.0/+esm");
        V86Starter = mod.V86Starter || mod.default?.V86Starter || mod.default;
      } catch (e) {
        log("CDN 引擎导入失败，请检查网络", "error");
        return;
      }

      log("v86 模块解析成功，初始化虚拟机...", "ok");

      try {
        const emulator = new V86Starter({
          // 强制将 wasm_path 指向与 js 严格配套的 CDN 构建版本
          wasm_path: "https://cdn.jsdelivr.net/npm/v86@0.4.0/build/v86.wasm",
          bios: { url: "./seabios.bin" },
          vga_bios: { url: "./vgabios.bin" },
          fda: { url: "./kolibri.img" },
          
          memory_size: 64 * 1024 * 1024,
          vga_memory_size: 8 * 1024 * 1024,
          screen_container: document.getElementById("screen_container"),
          autostart: true,
        });

        emulator.add_listener("emulator-ready", function() {
          log("WASM 虚拟机核心就绪，开始引导 KolibriOS...", "ok");
        });

        emulator.add_listener("screen-set-mode", function(is_graphical) {
          log(`显示模式切换: ${is_graphical ? "图形界面 (800x600)" : "文本界面 (BIOS)"}`, "info");
        });

      } catch (err) {
        log("虚拟机初始化失败: " + err.message, "error");
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>

</body>
</html>
