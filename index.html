<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KolibriOS 实时指针跟随版</title>
  <style>
    * { box-sizing: border-box; touch-action: none; }
    body {
      margin: 0;
      padding: 10px;
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }
    h1 { margin: 2px 0 8px 0; font-size: 1.1rem; color: #4da6ff; text-align: center; }
    
    #screen_container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 2px solid #333;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      position: relative;
    }
    #screen_container canvas, #screen_container div {
      width: 100% !important;
      height: 100% !important;
    }

    #touch_controls {
      width: 100%;
      max-width: 800px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      touch-action: auto;
    }
    .touch-btn {
      background: #222;
      color: #00aaff;
      border: 1px solid #444;
      padding: 12px 0;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
    }
    .touch-btn:active {
      background: #00aaff;
      color: #fff;
    }
    
    #log_container {
      width: 100%;
      max-width: 800px;
      background: #090909;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 8px;
      margin-top: 10px;
      touch-action: auto;
    }
    #log_title { font-size: 0.7rem; color: #666; margin-bottom: 4px; text-transform: uppercase; }
    #log_output { height: 60px; overflow-y: auto; font-size: 0.7rem; color: #00ff66; white-space: pre-wrap; word-break: break-all; }
    .log-err { color: #ff5555; }
    .log-info { color: #00aaff; }
    .log-ok { color: #00ff66; }
  </style>
</head>
<body>

  <h1>KolibriOS 指针跟随 + 双击打开版</h1>

  <div id="screen_container">
    <div style="white-space: pre; font-family: monospace; line-height: 14px; font-size: 13px; color: #aaa;"></div>
    <canvas></canvas>
  </div>

  <div id="touch_controls">
    <button class="touch-btn" id="btn_rclick">🔘 鼠标右键</button>
    <button class="touch-btn" id="btn_kbd">⌨️ 呼出键盘</button>
  </div>

  <div id="log_container">
    <div id="log_title">系统运行日志 (Runtime Log)</div>
    <div id="log_output"></div>
  </div>

  <script type="module">
    const logOutput = document.getElementById("log_output");
    let emulator = null;

    function log(msg, type = "normal") {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      if (type === "error") div.className = "log-err";
      if (type === "info") div.className = "log-info";
      if (type === "ok") div.className = "log-ok";
      div.textContent = `[${time}] ${msg}`;
      logOutput.appendChild(div);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    async function init() {
      log("正在载入 v86 引擎...", "info");

      let V86Starter;
      try {
        const mod = await import("https://cdn.jsdelivr.net/npm/v86@0.4.0/+esm");
        V86Starter = mod.V86Starter || mod.default?.V86Starter || mod.default;
      } catch (e) {
        log("CDN 引擎导入失败", "error");
        return;
      }

      try {
        emulator = new V86Starter({
          wasm_path: "https://cdn.jsdelivr.net/npm/v86@0.4.0/build/v86.wasm",
          bios: { url: "./seabios.bin" },
          vga_bios: { url: "./vgabios.bin" },
          fda: { url: "./kolibri.img" },
          memory_size: 64 * 1024 * 1024,
          vga_memory_size: 8 * 1024 * 1024,
          screen_container: document.getElementById("screen_container"),
          autostart: true,
        });

        emulator.add_listener("emulator-ready", function() {
          log("WASM 核心就绪，实时指针跟随已激活！", "ok");
          bindPointerTracking();
        });

      } catch (err) {
        log("虚拟机初始化失败: " + err.message, "error");
      }
    }

    // 绑定触摸跟随与双击检测
    function bindPointerTracking() {
      const container = document.getElementById("screen_container");
      let lastTapTime = 0;

      // 1. 获取像素转换坐标
      function getCanvasCoords(e) {
        const rect = container.getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 800);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 600);
        return { x, y };
      }

      // 2. 手指滑动/移动时：强行让鼠标指针跟着手指实时走
      container.addEventListener("pointermove", function(e) {
        if (!emulator) return;
        const coords = getCanvasCoords(e);
        emulator.mouse_move(coords.x, coords.y);
      });

      // 3. 手指点击屏幕时：判断是否为“双击”
      container.addEventListener("pointerdown", function(e) {
        if (!emulator) return;
        e.preventDefault();

        const coords = getCanvasCoords(e);
        // 按下时先更新指针位置
        emulator.mouse_move(coords.x, coords.y);

        const currentTime = new Date().getTime();
        const tapInterval = currentTime - lastTapTime;

        // 如果两次点击的时间间隔小于 300 毫秒，判定为双击
        if (tapInterval < 300 && tapInterval > 0) {
          log("检测到双击，正在打开程序...", "info");
          // 触发连续两次点击打开图标
          emulator.mouse_send_click(0);
          setTimeout(() => emulator.mouse_send_click(0), 50);
          lastTapTime = 0; // 重置
        } else {
          // 单击：只做选中/定位，不打开
          emulator.mouse_send_click(0);
          lastTapTime = currentTime;
        }
      }, { passive: false });

      // 4. 右键按钮辅助
      document.getElementById("btn_rclick").onclick = () => {
        log("请点击屏幕任意位置唤出右键菜单", "info");
        const rHandler = (e) => {
          e.preventDefault();
          const coords = getCanvasCoords(e);
          emulator.mouse_move(coords.x, coords.y);
          emulator.mouse_send_click(2);
          container.removeEventListener("pointerdown", rHandler, true);
        };
        container.addEventListener("pointerdown", rHandler, true);
      };

      // 5. 键盘呼出
      document.getElementById("btn_kbd").onclick = () => {
        const input = document.createElement("input");
        input.style.cssText = "position:absolute;opacity:0;top:0;";
        document.body.appendChild(input);
        input.focus();
        input.onkeydown = (e) => {
          if (emulator) emulator.keyboard_send_scancodes([e.keyCode]);
        };
      };
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>

</body>
</html>
