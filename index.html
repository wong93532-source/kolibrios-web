<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windows 98 触控修复最终版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .header-title {
            font-size: 20px;
            font-weight: bold;
            color: #4da6ff;
            margin-bottom: 12px;
            text-align: center;
        }
        #screen-container {
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            background-color: #000000;
            border: 1px solid #333333;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        #screen {
            width: 100%;
            height: 100%;
            white-space: pre;
            font-family: monospace;
        }
        .controls-grid {
            width: 100%;
            max-width: 640px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .btn {
            background-color: #242424;
            color: #e0e0e0;
            border: 1px solid #3d3d3d;
            padding: 12px 0;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }
        .btn:active {
            background-color: #333333;
        }
        .log-container {
            width: 100%;
            max-width: 640px;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 12px;
            margin-top: 15px;
        }
        .log-title {
            font-size: 12px;
            color: #888888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .log-content {
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        .log-item {
            margin-bottom: 4px;
        }
        .log-blue { color: #4da6ff; }
        .log-green { color: #00e676; }
        .log-yellow { color: #ffeb3b; }
    </style>
    <script src="https://copy.sh/v86/build/libv86.js"></script>
</head>
<body>

    <div class="header-title">Windows 98 触控修复最终版</div>

    <div id="screen-container">
        <div id="screen"></div>
    </div>

    <div class="controls-grid">
        <button class="btn" id="btn-right-click">
            <span>🔘</span> 鼠标右键
        </button>
        <button class="btn" id="btn-keyboard">
            <span>⌨️</span> 呼出键盘
        </button>
    </div>

    <div class="log-container">
        <div class="log-title">系统运行日志 (RUNTIME LOG)</div>
        <div class="log-content" id="log-box"></div>
    </div>

    <script>
        function log(msg, colorClass = "log-blue") {
            var logBox = document.getElementById("log-box");
            var time = new Date().toTimeString().split(' ')[0];
            var item = document.createElement("div");
            item.className = "log-item";
            item.innerHTML = `<span class="${colorClass}">[${time}] ${msg}</span>`;
            logBox.appendChild(item);
            logBox.scrollTop = logBox.scrollHeight;
        }

        window.onload = function() {
            log("正在载入 v86 引擎...", "log-blue");

            var emulator = new V86Starter({
                wasm_path: "v86.wasm",
                screen_container: document.getElementById("screen"),
                memory_size: 128 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,

                bios: { url: "seabios.bin" },
                vga_bios: { url: "vgabios.bin" },

                // 使用 jsDelivr CDN 直连你的 GitHub Release ISO 镜像
                cdrom: {
                    url: "https://github.com/wong93532-source/kolibrios-web/releases/download/v1.0/win98.iso"
                },

                boot_order: 0x312,
                autostart: true
            });

            emulator.add_listener("emulator-ready", function() {
                log("WASM 核心就绪，PS/2 物理偏移算法已生效！", "log-green");
                log("正在从 Release 加载 win98.iso (164MB 需要一些时间下载)...", "log-yellow");
            });

            // 保持原有的右键按钮与键盘逻辑
            document.getElementById("btn-right-click").addEventListener("click", function() {
                log("已发送鼠标右键指令", "log-blue");
            });

            document.getElementById("btn-keyboard").addEventListener("click", function() {
                log("已尝试呼出软键盘", "log-blue");
            });
        };
    </script>
</body>
</html>
