<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KolibriOS Web Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin: 5px 0 10px 0; font-size: 1.3rem; color: #4da6ff; text-align: center; }
    #screen_container {
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 2px solid #333;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      line-height: 0;
      margin-bottom: 12px;
      max-width: 100%;
    }
    canvas { display: block; max-width: 100%; height: auto; }
    
    #log_container {
      width: 100%;
      max-width: 640px;
      background: #090909;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px;
    }
    #log_title { font-size: 0.75rem; color: #666; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    #log_output { height: 120px; overflow-y: auto; font-size: 0.75rem; color: #00ff66; white-space: pre-wrap; word-break: break-all; }
    .log-err { color: #ff5555; }
    .log-info { color: #00aaff; }
    .log-ok { color: #00ff66; }
  </style>
</head>
<body>

  <h1>KolibriOS 网页运行版</h1>

  <div id="screen_container">
    <canvas id="screen"></canvas>
  </div>

  <div id="log_container">
    <div id="log_title">系统运行日志 (Runtime Log)</div>
    <div id="log_output"></div>
  </div>

  <script type="module">
    const logOutput = document.getElementById("log_output");

    function log(msg, type = "normal") {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      if (type === "error") div.className = "log-err";
      if (type === "info") div.className = "log-info";
      if (type === "ok") div.className = "log-ok";
      div.textContent = `[${time}] ${msg}`;
      logOutput.appendChild(div);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    async function checkFiles() {
      const files = ["./v86.wasm", "./seabios.bin", "./vgabios.bin", "./kolibri.img"];
      log("开始校验本地 OS 镜像文件...", "info");

      for (const file of files) {
        try {
          const res = await fetch(file, { method: "HEAD" });
          if (!res.ok) {
            log(`缺失文件: ${file} (HTTP ${res.status})`, "error");
            return false;
          }
        } catch (e) {
          log(`无法读取文件: ${file}`, "error");
          return false;
        }
      }
      log("镜像文件校验成功！", "ok");
      return true;
    }

    async function init() {
      const ready = await checkFiles();
      if (!ready) return;

      log("正在通过 ESM 加载 v86 引擎...", "info");

      let V86Starter;
      
      // 1. 尝试从 jsDelivr 动态 import 模块
      try {
        const mod = await import("https://cdn.jsdelivr.net/npm/v86@0.4.0/+esm");
        V86Starter = mod.V86Starter || mod.default?.V86Starter || mod.default;
      } catch (e) {
        log("节点 1 加载失败，尝试备用 ES 节点...", "info");
      }

      // 2. 备用 esm.sh 节点
      if (!V86Starter) {
        try {
          const mod = await import("https://esm.sh/v86");
          V86Starter = mod.V86Starter || mod.default?.V86Starter || mod.default;
        } catch (e) {
          log("节点 2 加载失败...", "info");
        }
      }

      if (!V86Starter) {
        log("无法加载 V86Starter 模块，请检查网络是否能访问 CDN 服务。", "error");
        return;
      }

      log("v86 模块解析成功，准备引导虚拟机...", "ok");

      try {
        const emulator = new V86Starter({
          wasm_path: "./v86.wasm",
          bios: { url: "./seabios.bin" },
          vga_bios: { url: "./vgabios.bin" },
          fda: { url: "./kolibri.img" },
          
          memory_size: 64 * 1024 * 1024,
          vga_memory_size: 8 * 1024 * 1024,
          screen_container: document.getElementById("screen_container"),
          autostart: true,
        });

        log("KolibriOS 启动命令已发送！", "ok");
      } catch (err) {
        log("虚拟机启动崩溃: " + err.message, "error");
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>

</body>
</html>
