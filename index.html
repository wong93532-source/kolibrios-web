<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KolibriOS Web Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin: 5px 0; font-size: 1.4rem; color: #4da6ff; }
    #screen_container {
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 2px solid #333;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      line-height: 0;
      margin-bottom: 15px;
    }
    canvas { display: block; }
    
    #log_container {
      width: 100%;
      max-width: 640px;
      background: #090909;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px;
    }
    #log_title {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #log_output {
      height: 120px;
      overflow-y: auto;
      font-size: 0.75rem;
      color: #00ff66;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-err { color: #ff5555; }
    .log-info { color: #00aaff; }
  </style>

  <!-- 动态监视 libv86.js 加载状态 -->
  <script>
    window.v86Loaded = false;
  </script>
  <script src="https://copy.sh/v86/build/libv86.js" onload="window.v86Loaded = true;" onerror="window.v86LoadError = true;"></script>
</head>
<body>

  <h1>KolibriOS 网页运行版</h1>

  <div id="screen_container">
    <canvas id="screen"></canvas>
  </div>

  <div id="log_container">
    <div id="log_title">系统运行日志 (Runtime Log)</div>
    <div id="log_output"></div>
  </div>

  <script>
    const logOutput = document.getElementById("log_output");

    function log(msg, type = "normal") {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      if (type === "error") div.className = "log-err";
      if (type === "info") div.className = "log-info";
      div.textContent = `[${time}] ${msg}`;
      logOutput.appendChild(div);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    // 检查并等待 V86Starter 载入
    function startEmulator() {
      if (window.v86LoadError) {
        log("libv86.js 加载失败！请检查网络或是否开启了广告拦截插件 (AdBlocker)。", "error");
        return;
      }

      if (typeof V86Starter === "undefined") {
        log("等待 v86 核心库加载中...", "info");
        setTimeout(startEmulator, 300); // 每 300ms 检查一次
        return;
      }

      log("v86 核心库加载完成，开始启动虚拟机...", "info");
      try {
        var emulator = new V86Starter({
          wasm_path: "https://copy.sh/v86/build/v86.wasm",
          memory_size: 64 * 1024 * 1024,
          vga_memory_size: 8 * 1024 * 1024,
          screen_container: document.getElementById("screen_container"),
          bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
          vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
          fda: { url: "./kolibri.img" },
          autostart: true,
        });
        log("KolibriOS 已成功引导！", "info");
      } catch (e) {
        log("模拟器启动异常: " + e.message, "error");
      }
    }

    window.onload = function() {
      log("检测镜像文件...", "info");
      fetch("./kolibri.img", { method: "HEAD" })
        .then(res => {
          if (!res.ok) {
            log(`镜像文件读取失败 (HTTP ${res.status})`, "error");
          } else {
            log("镜像文件检测正常！", "info");
            startEmulator();
          }
        })
        .catch(err => log("网络错误: " + err.message, "error"));
    };
  </script>

</body>
</html>
