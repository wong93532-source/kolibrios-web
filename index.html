<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KolibriOS Web Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin: 5px 0; font-size: 1.4rem; color: #4da6ff; }
    #screen_container {
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 2px solid #333;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      line-height: 0;
      margin-bottom: 15px;
    }
    canvas { display: block; }
    
    /* 日志面板样式 */
    #log_container {
      width: 100%;
      max-width: 640px;
      background: #090909;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px;
    }
    #log_title {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #log_output {
      height: 120px;
      overflow-y: auto;
      font-size: 0.75rem;
      color: #00ff66;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-err { color: #ff5555; }
    .log-info { color: #00aaff; }
  </style>
</head>
<body>

  <h1>KolibriOS 网页运行版</h1>

  <!-- 模拟器屏幕容器 -->
  <div id="screen_container">
    <canvas id="screen"></canvas>
  </div>

  <!-- 日志输出控制台 -->
  <div id="log_container">
    <div id="log_title">系统运行日志 (Runtime Log)</div>
    <div id="log_output"></div>
  </div>

  <script src="https://copy.sh/v86/build/libv86.js"></script>
  <script>
    const logOutput = document.getElementById("log_output");

    function log(msg, type = "normal") {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      if (type === "error") div.className = "log-err";
      if (type === "info") div.className = "log-info";
      div.textContent = `[${time}] ${msg}`;
      logOutput.appendChild(div);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    window.onload = function() {
      log("开始初始化 v86 模拟器...", "info");

      // 预先拦截 fetch 检测镜像是否存在
      fetch("./kolibri.img", { method: "HEAD" })
        .then(res => {
          if (!res.ok) {
            log(`镜像请求失败！HTTP 状态码: ${res.status} (${res.statusText})`, "error");
            log("请检查仓库根目录中是否存在 kolibri.img 文件，且文件名全为小写。", "error");
          } else {
            log("成功找到 kolibri.img 镜像文件，正在启动 BIOS 载入...", "info");
          }
        })
        .catch(err => log("网络错误或跨域拦截: " + err.message, "error"));

      try {
        var emulator = new V86Starter({
          wasm_path: "https://copy.sh/v86/build/v86.wasm",
          memory_size: 64 * 1024 * 1024,
          vga_memory_size: 8 * 1024 * 1024,
          screen_container: document.getElementById("screen_container"),
          bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
          vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
          fda: { url: "./kolibri.img" },
          autostart: true,
        });

        // 监听虚拟串口输出日志
        emulator.add_listener("serial0-output-char", function(char) {
          // 可选：将虚拟机内部输出转存至日志面板
        });

      } catch (e) {
        log("模拟器崩溃: " + e.message, "error");
      }
    };
  </script>

</body>
</html>
