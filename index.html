<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KolibriOS Web Edition</title>
  <style>
    * { box-sizing: border-box; touch-action: none; }
    body {
      margin: 0;
      padding: 10px;
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }
    h1 { margin: 2px 0 8px 0; font-size: 1.1rem; color: #4da6ff; text-align: center; }
    
    #screen_container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 2px solid #333;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      position: relative;
    }
    #screen_container canvas, #screen_container div {
      width: 100% !important;
      height: 100% !important;
    }

    #touch_controls {
      width: 100%;
      max-width: 800px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      touch-action: auto;
    }
    .touch-btn {
      background: #222;
      color: #00aaff;
      border: 1px solid #444;
      padding: 12px 0;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
    }
    .touch-btn:active {
      background: #00aaff;
      color: #fff;
    }
    
    #log_container {
      width: 100%;
      max-width: 800px;
      background: #090909;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 8px;
      margin-top: 10px;
      touch-action: auto;
    }
    #log_title { font-size: 0.7rem; color: #666; margin-bottom: 4px; text-transform: uppercase; }
    #log_output { height: 60px; overflow-y: auto; font-size: 0.7rem; color: #00ff66; white-space: pre-wrap; word-break: break-all; }
    .log-err { color: #ff5555; }
    .log-info { color: #00aaff; }
    .log-ok { color: #00ff66; }
  </style>
</head>
<body>

  <h1>KolibriOS 触控修复版</h1>

  <div id="screen_container">
    <div style="white-space: pre; font-family: monospace; line-height: 14px; font-size: 13px; color: #aaa;"></div>
    <canvas></canvas>
  </div>

  <div id="touch_controls">
    <button class="touch-btn" id="btn_mode">👆 单击模式</button>
    <button class="touch-btn" id="btn_rclick">🔘 鼠标右键</button>
    <button class="touch-btn" id="btn_kbd">⌨️ 呼出键盘</button>
  </div>

  <div id="log_container">
    <div id="log_title">系统运行日志 (Runtime Log)</div>
    <div id="log_output"></div>
  </div>

  <script type="module">
    const logOutput = document.getElementById("log_output");
    let emulator = null;
    let isDoubleClickMode = true; // 默认触控屏幕直接执行双击

    function log(msg, type = "normal") {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      if (type === "error") div.className = "log-err";
      if (type === "info") div.className = "log-info";
      if (type === "ok") div.className = "log-ok";
      div.textContent = `[${time}] ${msg}`;
      logOutput.appendChild(div);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    async function init() {
      log("正在载入 v86 引擎...", "info");

      let V86Starter;
      try {
        const mod = await import("https://cdn.jsdelivr.net/npm/v86@0.4.0/+esm");
        V86Starter = mod.V86Starter || mod.default?.V86Starter || mod.default;
      } catch (e) {
        log("CDN 引擎导入失败", "error");
        return;
      }

      try {
        emulator = new V86Starter({
          wasm_path: "https://cdn.jsdelivr.net/npm/v86@0.4.0/build/v86.wasm",
          bios: { url: "./seabios.bin" },
          vga_bios: { url: "./vgabios.bin" },
          fda: { url: "./kolibri.img" },
          memory_size: 64 * 1024 * 1024,
          vga_memory_size: 8 * 1024 * 1024,
          screen_container: document.getElementById("screen_container"),
          autostart: true,
        });

        emulator.add_listener("emulator-ready", function() {
          log("WASM 核心就绪！已启用点击精确定位", "ok");
          setupPointerBridge();
        });

      } catch (err) {
        log("虚拟机初始化失败: " + err.message, "error");
      }
    }

    // 建立真正的硬件指针桥接
    function setupPointerBridge() {
      const container = document.getElementById("screen_container");

      // 单击/双击模式切换
      const btnMode = document.getElementById("btn_mode");
      btnMode.onclick = () => {
        isDoubleClickMode = !isDoubleClickMode;
        btnMode.textContent = isDoubleClickMode ? "⚡ 双击模式 (默认)" : "👆 单击模式";
        log(`点击模式切换为: ${isDoubleClickMode ? "双击打开图标" : "普通单击"}`, "info");
      };

      // 发送完整 MouseClick 事件 (按下 + 释放)
      function sendCompleteClick(x, y, button = 0) {
        if (!emulator) return;
        
        // 1. 坐标归一化并移动指针
        emulator.mouse_move(x, y);

        // 2. 模拟真实物理按键的 Press 与 Release 周期
        emulator.mouse_send_click(button);

        // 如果是双击模式，120ms 后追加第二次完整点击
        if (isDoubleClickMode && button === 0) {
          setTimeout(() => {
            emulator.mouse_send_click(0);
          }, 120);
        }
      }

      // 监听触摸/指针点按
      container.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        
        const rect = container.getBoundingClientRect();
        // 计算映射到虚拟机 1024x768 或 800x600 像素坐标系上的 X/Y
        const scaleX = 800 / rect.width;
        const scaleY = 600 / rect.height;
        const canvasX = Math.round((e.clientX - rect.left) * scaleX);
        const canvasY = Math.round((e.clientY - rect.top) * scaleY);

        sendCompleteClick(canvasX, canvasY, 0);
      });

      // 右键按钮
      document.getElementById("btn_rclick").onclick = () => {
        log("等待点击屏幕位置以唤出右键菜单...", "info");
        const handler = (e) => {
          const rect = container.getBoundingClientRect();
          const canvasX = Math.round((e.clientX - rect.left) * (800 / rect.width));
          const canvasY = Math.round((e.clientY - rect.top) * (800 / rect.height));
          sendCompleteClick(canvasX, canvasY, 2);
          container.removeEventListener("pointerdown", handler, true);
        };
        container.addEventListener("pointerdown", handler, true);
      };

      // 键盘呼出
      document.getElementById("btn_kbd").onclick = () => {
        const input = document.createElement("input");
        input.style.cssText = "position:absolute;opacity:0;top:0;";
        document.body.appendChild(input);
        input.focus();
        input.onkeydown = (e) => {
          if (emulator) emulator.keyboard_send_scancodes([e.keyCode]);
        };
      };
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>

</body>
</html>
