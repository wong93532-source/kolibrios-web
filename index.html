<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win98 ISO 网页引导测试</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #screen-container {
            border: 2px solid #555;
            background: #000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        #screen {
            white-space: pre;
            font-family: monospace;
        }
        .status {
            margin-top: 12px;
            font-size: 14px;
            color: #4af626;
        }
    </style>
    <script src="https://copy.sh/v86/build/libv86.js"></script>
</head>
<body>

    <h2>v86 ISO 光盘直接引导测试</h2>

    <div id="screen-container">
        <div id="screen"></div>
    </div>

    <div class="status" id="status">准备载入 ISO...</div>

    <script>
        window.onload = function() {
            var statusText = document.getElementById("status");

            var emulator = new V86Starter({
                wasm_path: "https://copy.sh/v86/build/v86.wasm",
                screen_container: document.getElementById("screen"),
                memory_size: 128 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,

                bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
                vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },

                // 核心变化：将 ISO 挂载到 cdrom 接口
                cdrom: {
                    url: "win98.iso"
                },

                // 显式指定优先从光盘启动 (1: 软盘, 2: 硬盘, 3: 光盘)
                boot_order: 0x312,

                autostart: true
            });

            emulator.add_listener("emulator-ready", function() {
                statusText.innerText = "虚拟机已就绪，正在从 ISO 光盘引导...";
            });
        };
    </script>
</body>
</html>
