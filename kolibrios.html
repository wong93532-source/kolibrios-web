<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KolibriOS Web Edition</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.8rem;
      color: #58a6ff;
    }
    p {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #8b949e;
    }
    #screen_container {
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      border: 2px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      display: inline-block;
      line-height: 0;
    }
    canvas {
      display: block;
    }
    .status {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #7ee787;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>KolibriOS 网页版</h1>
    <p>完全由汇编语言编写的微型操作系统 (x86 WebAssembly 模拟器)</p>

    <div id="screen_container">
      <canvas id="screen"></canvas>
    </div>

    <div id="status" class="status">正在初始化模拟器...</div>
  </div>

  <!-- 从 CDN 自动加载 v86 引擎 -->
  <script src="https://copy.sh/v86/build/libv86.js"></script>
  <script>
    window.onload = function() {
      var statusEl = document.getElementById("status");

      try {
        var emulator = new V86Starter({
          wasm_path: "https://copy.sh/v86/build/v86.wasm",
          memory_size: 64 * 1024 * 1024,      // 64MB 内存
          vga_memory_size: 8 * 1024 * 1024,  // 8MB 显存
          screen_container: document.getElementById("screen_container"),
          bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
          vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
          fda: { url: "./kolibri.img" },      // 挂载同目录下的镜像文件
          autostart: true,
        });

        emulator.add_listener("emulator-ready", function() {
          statusEl.innerText = "系统运行中 (点击屏幕开始交互)";
        });
      } catch (e) {
        statusEl.style.color = "#f85149";
        statusEl.innerText = "加载失败，请检查镜像文件是否存在。";
        console.error(e);
      }
    };
  </script>

</body>
</html>
